name: foundation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cp .env.example .env && docker compose config --quiet
      - run: npm run infra:up
      - run: npm run test:auth
      - run: npm run db:migrate
      - run: npm run test:resources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev-storage.txt
            requirements-dev-index.txt
      - run: python -m pip install -r requirements-dev-storage.txt
      - name: Start development S3 protocol service
        run: |
          moto_server -H 127.0.0.1 -p 9000 > /tmp/s3.log 2>&1 &
          echo "$!" > /tmp/s3.pid
          curl --retry 15 --retry-connrefused --retry-delay 1 --max-time 30 -fsS http://127.0.0.1:9000/ > /dev/null
      - run: npm run storage:init
      - run: npm run test:uploads
      - run: npm run test:ingestion
      - run: npm run test:parsing
      - run: npm run test:chunking
      - run: python -m pip install -r requirements-dev-index.txt
      - run: npm run test:indexing
      - run: npm run test:retrieval
      - run: npm run test:lifecycle
      - run: npm run test:lexical
      - run: npm run test:hybrid
      - run: npm run test:reranking
      - run: npm run test:connectors
      - run: npm run test:releases
      - run: npm run test:lab
      - run: npm run test:feedback
      - name: Worker queue and independent restart
        run: |
          node --env-file=.env apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          npm run smoke:queue
          kill "$worker_pid"
          wait "$worker_pid" || true
          node --env-file=.env apps/worker/dist/main.js >> /tmp/worker.log 2>&1 &
          worker_pid=$!
          npm run smoke:queue
      - if: always()
        run: |
          docker compose down
          if [ -f /tmp/s3.pid ]; then kill "$(cat /tmp/s3.pid)" 2>/dev/null || true; fi
